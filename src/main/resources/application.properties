spring.application.name=ShopSphere
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsphere?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:shopsphere}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.jackson.deserialization.fail-on-unknown-properties=true
shopsphere.admin.email=${ADMIN_EMAIL:}
shopsphere.admin.password=${ADMIN_PASSWORD:}
shopsphere.seed=${SEED_CATALOG:true}
