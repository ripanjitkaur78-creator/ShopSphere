<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | ShopSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script src="common.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body data-page="register">
<a class="skip-link" href="#main">Skip to content</a>
<header class="navbar navbar-dark bg-primary">
  <nav class="container nav-content" aria-label="Main navigation">
    <a class="navbar-brand" href="index.html">ShopSphere</a>
    <div class="nav-links">
      <a href="index.html">Home</a><a href="products.html">Products</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
      <a href="orders.html" data-signed-in hidden>My orders</a>
      <a href="admin.html" id="admin-link" hidden>Admin</a>
      <a href="login.html" data-signed-out>Login</a>
      <a href="register.html" data-signed-out>Register</a>
      <span id="account-name" data-signed-in hidden></span>
      <button id="logout" class="btn btn-light btn-sm" data-signed-in hidden type="button">Logout</button>
    </div>
  </nav>
</header>
<div id="notice" class="container" aria-live="polite"></div>
<main id="main" class="container page-content">
<section class="card auth-panel"><div class="card-body"><h1>Create account</h1>
<form id="auth-form" method="post"><div class="mb-3"><label for="name" class="form-label">Full name</label><input id="name" class="form-control" name="name" maxlength="80" autocomplete="name" required></div>
<div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control" maxlength="180" autocomplete="email" required></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="new-password" minlength="10" maxlength="72" required>
<small>Use 10–72 characters and no more than 72 UTF-8 bytes.</small></div>
<div class="mb-3"><label for="confirm-password" class="form-label">Confirm password</label><input id="confirm-password" class="form-control" type="password" autocomplete="new-password" required></div><p id="auth-error" class="text-danger" role="alert"></p><button class="btn btn-primary" type="submit">Create account</button>
</form><p class="mt-3"><a id="other-auth" href="login.html">Already have an account? Login</a></p></div></section>
</main>
<footer class="container site-footer">ShopSphere · Prices in INR · Cash on delivery only</footer>

</body>
</html>
