<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | ShopSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script src="common.js" defer></script>
  <script src="products.js" defer></script>
</head>
<body data-page="products">
<a class="skip-link" href="#main">Skip to content</a>
<header class="navbar navbar-dark bg-primary">
  <nav class="container nav-content" aria-label="Main navigation">
    <a class="navbar-brand" href="index.html">ShopSphere</a>
    <div class="nav-links">
      <a href="index.html">Home</a><a href="products.html">Products</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
      <a href="orders.html" data-signed-in hidden>My orders</a>
      <a href="admin.html" id="admin-link" hidden>Admin</a>
      <a href="login.html" data-signed-out>Login</a>
      <a href="register.html" data-signed-out>Register</a>
      <span id="account-name" data-signed-in hidden></span>
      <button id="logout" class="btn btn-light btn-sm" data-signed-in hidden type="button">Logout</button>
    </div>
  </nav>
</header>
<div id="notice" class="container" aria-live="polite"></div>
<main id="main" class="container page-content">
<h1>Products</h1>
<form id="filters" action="products.html" class="filter-row" role="search">
  <div><label for="query" class="form-label">Search products</label><input class="form-control" id="query" name="q" maxlength="200" type="search"></div>
  <div><label for="category" class="form-label">Category</label><select class="form-select" id="category" name="category"><option value="">All categories</option></select></div>
  <button class="btn btn-primary" type="submit">Search</button>
</form>
<div class="sort-row"><label for="sort">Sort by</label><select id="sort" class="form-select"><option value="default">Featured first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select></div>
<p id="result-count" role="status">Loading products...</p><div id="product-list" class="product-grid"></div>
</main>
<footer class="container site-footer">ShopSphere · Prices in INR · Cash on delivery only</footer>
<template id="product-card-template">
  <article class="card product-card">
    <a data-product-link><img class="product-image" loading="lazy" referrerpolicy="no-referrer" alt=""></a>
    <div class="card-body">
      <p class="text-muted" data-category></p>
      <h2 class="h5"><a data-product-link data-name></a></h2>
      <p data-price></p><p data-stock></p>
      <button class="btn btn-primary" type="button">Add to cart</button>
    </div>
  </article>
</template>
</body>
</html>
