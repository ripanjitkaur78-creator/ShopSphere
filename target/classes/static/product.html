<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | ShopSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script src="common.js" defer></script>
  <script src="product.js" defer></script>
</head>
<body data-page="product">
<a class="skip-link" href="#main">Skip to content</a>
<header class="navbar navbar-dark bg-primary">
  <nav class="container nav-content" aria-label="Main navigation">
    <a class="navbar-brand" href="index.html">ShopSphere</a>
    <div class="nav-links">
      <a href="index.html">Home</a><a href="products.html">Products</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
      <a href="orders.html" data-signed-in hidden>My orders</a>
      <a href="admin.html" id="admin-link" hidden>Admin</a>
      <a href="login.html" data-signed-out>Login</a>
      <a href="register.html" data-signed-out>Register</a>
      <span id="account-name" data-signed-in hidden></span>
      <button id="logout" class="btn btn-light btn-sm" data-signed-in hidden type="button">Logout</button>
    </div>
  </nav>
</header>
<div id="notice" class="container" aria-live="polite"></div>
<main id="main" class="container page-content">
<p><a href="products.html">Back to products</a></p>
<section id="product-details" class="detail-layout" hidden>
  <img id="product-image" class="detail-image" referrerpolicy="no-referrer" alt="">
  <div><p id="product-category" class="text-muted"></p><h1 id="product-name">Product</h1>
    <p id="product-price" class="h4"></p><p id="product-description" class="preserve-lines"></p><p id="product-stock"></p>
    <form id="buy-form" class="inline-form"><div><label for="quantity" class="form-label">Quantity</label><input id="quantity" class="form-control quantity-input" name="quantity" type="number" min="1" max="99" value="1" required></div><button type="submit" class="btn btn-primary">Add to cart</button></form>
    <p class="mt-3">Cash on delivery only. Pay when your order arrives.</p>
  </div>
</section>
</main>
<footer class="container site-footer">ShopSphere · Prices in INR · Cash on delivery only</footer>

</body>
</html>
